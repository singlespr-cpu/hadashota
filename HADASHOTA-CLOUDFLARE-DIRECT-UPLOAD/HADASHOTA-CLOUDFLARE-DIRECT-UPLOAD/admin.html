<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>ניהול | כותרת פלוס</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#101828;font-family:Arial,sans-serif}.wrap{width:min(680px,calc(100% - 28px));margin:48px auto}.card{background:#fff;border:1px solid #e4e7ec;border-radius:22px;box-shadow:0 18px 60px rgba(16,24,40,.08);padding:24px}h1{font-size:24px;margin:0 0 6px}.muted{color:#667085;font-size:13px;margin:0 0 22px}label{display:grid;gap:7px;font-size:12px;font-weight:800;margin:14px 0}input,textarea{width:100%;border:1px solid #d0d5dd;border-radius:12px;padding:12px;font:inherit}textarea{min-height:88px}.hidden{display:none!important}button{border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}.primary{background:#ff3b30;color:#fff}.secondary{background:#eef2f6;color:#344054}.danger{background:#fff0ef;color:#b42318}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.status{margin-top:14px;font-size:12px;color:#475467}.preview{margin-top:18px;border:1px dashed #d0d5dd;border-radius:16px;overflow:hidden;min-height:130px;position:relative;background:#f8fafc;display:flex;align-items:flex-end}.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(transparent,rgba(0,0,0,.78))}.preview strong{position:relative;z-index:2;color:#fff;padding:16px;font-size:17px}.preview.no-image strong{color:#344054}.preview.no-image .shade{display:none}.tiny{font-size:11px;color:#98a2b3;margin-top:8px}.topline{display:flex;justify-content:space-between;gap:12px}.brand{font-weight:900;color:#ff3b30}</style></head><body><main class="wrap">
<section class="card" id="loginCard"><div class="topline"><span class="brand">כותרת פלוס</span><span>ניהול</span></div><h1>כניסה לניהול</h1><p class="muted">האזור אינו מקושר מהאתר.</p><label>שם משתמש<input id="loginUser"></label><label>סיסמה<input id="loginPass" type="password"></label><button class="primary" id="loginBtn">כניסה</button><div class="status" id="loginStatus"></div></section>
<section class="card hidden" id="editorCard"><div class="topline"><span class="brand">כותרת פלוס</span><button class="secondary" id="logoutBtn">יציאה</button></div><h1>קוביית „פרסם כאן”</h1><p class="muted">תמונה, מלל קצר וקישור.</p><label>תמונה<input id="promoImage" type="file" accept="image/jpeg,image/png,image/webp"></label><label>מלל קצר<textarea id="promoText" maxlength="120"></textarea></label><label>קישור<input id="promoUrl" type="url" placeholder="https://..."></label><div class="preview no-image" id="preview"><img id="previewImg" class="hidden" alt=""><span class="shade"></span><strong id="previewText">תצוגה מקדימה</strong></div><div class="actions"><button class="primary" id="saveBtn">פרסם באתר</button><button class="danger" id="removeBtn">הסר פרסום</button></div><div class="status" id="editorStatus"></div><p class="tiny">התמונה מוקטנת אוטומטית לפני שמירה.</p>
<hr style="border:0;border-top:1px solid #e4e7ec;margin:28px 0">
<h1>פרסום בראש „כל העדכונים”</h1><p class="muted">יופיע רק כשיש פרסום פעיל, כאייטם הראשון בפיד. אין באנר או מקום שמור כשהוא כבוי.</p>
<label>תמונה<input id="feedPromoImage" type="file" accept="image/jpeg,image/png,image/webp"></label>
<label>מלל קצר<textarea id="feedPromoText" maxlength="120"></textarea></label>
<label>קישור<input id="feedPromoUrl" type="url" placeholder="https://..."></label>
<div class="preview no-image" id="feedPreview"><img id="feedPreviewImg" class="hidden" alt=""><span class="shade"></span><strong id="feedPreviewText">תצוגה מקדימה</strong></div>
<div class="actions"><button class="primary" id="feedSaveBtn">פרסם בפיד</button><button class="danger" id="feedRemoveBtn">הסר מהפיד</button></div>
<div class="status" id="feedEditorStatus"></div>
</section></main>
<script>
(()=>{const $=id=>document.getElementById(id);let credentials=null,imageData="",feedImageData="";async function api(action,promo){const r=await fetch("/api/admin/promo",{method:"POST",headers:{"Content-Type":"application/json"},cache:"no-store",body:JSON.stringify({action,...credentials,promo})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
async function feedApi(action,promo){const r=await fetch("/api/admin/feed-promo",{method:"POST",headers:{"Content-Type":"application/json"},cache:"no-store",body:JSON.stringify({action,...credentials,promo})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
function feedPreview(){$("feedPreviewText").textContent=$("feedPromoText").value.trim()||"תצוגה מקדימה";if(feedImageData){$("feedPreviewImg").src=feedImageData;$("feedPreviewImg").classList.remove("hidden");$("feedPreview").classList.remove("no-image")}else{$("feedPreviewImg").classList.add("hidden");$("feedPreview").classList.add("no-image")}}
function preview(){$("previewText").textContent=$("promoText").value.trim()||"תצוגה מקדימה";if(imageData){$("previewImg").src=imageData;$("previewImg").classList.remove("hidden");$("preview").classList.remove("no-image")}else{$("previewImg").classList.add("hidden");$("preview").classList.add("no-image")}}async function resize(file){const b=await createImageBitmap(file),ratio=Math.min(1,1000/b.width,650/b.height),c=document.createElement("canvas");c.width=Math.max(1,Math.round(b.width*ratio));c.height=Math.max(1,Math.round(b.height*ratio));c.getContext("2d").drawImage(b,0,0,c.width,c.height);b.close();return c.toDataURL("image/jpeg",.82)}
$("loginBtn").onclick=async()=>{credentials={username:$("loginUser").value.trim(),password:$("loginPass").value};$("loginStatus").textContent="בודק…";try{const d=await api("get");const fd=await feedApi("get");sessionStorage.setItem("kp-u",credentials.username);sessionStorage.setItem("kp-p",credentials.password);$("loginCard").classList.add("hidden");$("editorCard").classList.remove("hidden");$("promoText").value=d.promo?.text||"";$("promoUrl").value=d.promo?.url||"";imageData=d.promo?.imageData||"";preview();$("editorStatus").textContent=d.promo?.active?"יש פרסום פעיל.":"אין פרסום פעיל.";$("feedPromoText").value=fd.promo?.text||"";$("feedPromoUrl").value=fd.promo?.url||"";feedImageData=fd.promo?.imageData||"";feedPreview();$("feedEditorStatus").textContent=fd.promo?.active?"יש פרסום פעיל בפיד.":"אין פרסום פעיל בפיד."}catch(e){$("loginStatus").textContent=e.message;credentials=null}};
$("logoutBtn").onclick=()=>{sessionStorage.clear();location.reload()};$("promoText").oninput=preview;$("promoImage").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;$("editorStatus").textContent="מעבד תמונה…";try{imageData=await resize(f);preview();$("editorStatus").textContent="התמונה מוכנה."}catch{$("editorStatus").textContent="שגיאה בעיבוד התמונה."}};
$("saveBtn").onclick=async()=>{try{$("editorStatus").textContent="מפרסם…";await api("save",{text:$("promoText").value.trim(),url:$("promoUrl").value.trim(),imageData});$("editorStatus").textContent="פורסם בהצלחה."}catch(e){$("editorStatus").textContent=e.message}};
$("removeBtn").onclick=async()=>{try{await api("remove");$("editorStatus").textContent="הפרסום הוסר."}catch(e){$("editorStatus").textContent=e.message}};
$("feedPromoText").oninput=feedPreview;$("feedPromoImage").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;$("feedEditorStatus").textContent="מעבד תמונה…";try{feedImageData=await resize(f);feedPreview();$("feedEditorStatus").textContent="התמונה מוכנה."}catch{$("feedEditorStatus").textContent="שגיאה בעיבוד התמונה."}};
$("feedSaveBtn").onclick=async()=>{try{$("feedEditorStatus").textContent="מפרסם…";await feedApi("save",{text:$("feedPromoText").value.trim(),url:$("feedPromoUrl").value.trim(),imageData:feedImageData});$("feedEditorStatus").textContent="פורסם בראש הפיד בהצלחה."}catch(e){$("feedEditorStatus").textContent=e.message}};
$("feedRemoveBtn").onclick=async()=>{try{await feedApi("remove");$("feedEditorStatus").textContent="הפרסום הוסר מהפיד."}catch(e){$("feedEditorStatus").textContent=e.message}};
const u=sessionStorage.getItem("kp-u"),p=sessionStorage.getItem("kp-p");if(u&&p){$("loginUser").value=u;$("loginPass").value=p;setTimeout(()=>$("loginBtn").click(),50)}})();
</script></body></html>
