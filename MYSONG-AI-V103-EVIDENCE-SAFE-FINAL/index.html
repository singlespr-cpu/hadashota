    { id: 'about_company', category: 'about', priority: 12, keywords: ['מי אתם', 'מה זה מייסונג', 'מי הבעלים', 'מדיה פורסט', 'על החברה', 'מה אתם עושים', 'ספרו לי על מייסונג', 'ספר לי על מייסונג', 'ספרי לי על מייסונג', 'מה זה פה', 'מה השירות שלכם', 'על מייסונג', 'קצת עליכם', 'מי עומד מאחורי', 'ספרי לי עליכם', 'ספרו לי עליכם', 'ספרו עליכם', 'תספרו עליכם', 'מה החברה עושה', 'תספרו לי על השירות שלכם', 'אפשר פרטים עליכם', 'מה זה האתר הזה', 'מהי המערכת הזו', 'מה השירות שאתם מציעים', 'אשמח לשמוע עליכם', 'ספרו קצת על החברה', 'תסבירו לי על השירות', 'תסבירו לי עליכם', 'מהות השירות שלכם', 'איזה שירות אתם נותנים', 'תנו מידע על האתר', 'מה המטרה של האתר', 'מה חברת מייסונג עושה', 'תספר לי עליכם', 'תספרי לי עליכם', 'מה אתם יודעים לעשות', 'מי זו חברת מייסונג', 'מי החברה מאחורי האתר', 'מדיה פורסט מי אלה', 'על איזה חברה מדובר', 'קצת עליכם בקצרה', 'מי אתם בעצם'], response: "נעים להכיר :) אנחנו מייסונג - מקבוצת 'מדיה פורסט'\nמערכת להפצת סינגלים, אלבומים וקליפים, לאנשי המדיה וגופי התקשורת. מייסונג הוקם באהבה גדולה על ידי קבוצת אנשים שאוהבת ומחוברת למוסיקה! בין יוזמי ומקדמי האתר, עומדת חברת 'מדיה פורסט' החברה המובילה את ההפצה והניטור בארץ ובעולם.\n\nבצוות שמקדם את רעיון הנגשת המוזיקה בעלויות מסובסדות, אפשר למצוא צוות משרד מקצועי, אשר ילווה את האמן לאורך כל תהליך ההפצה, ואנשי מחשוב וטכנולוגיה – הדואגים בכל עת למערכת חכמה, יעילה ומהירה." },

// A complete new question is answered on its own, while the project memory is preserved
// in the session for a later true follow-up.
const isObviousExternalDomainQuery = (rawQuery) => {
    const clean = normalizeBaseText(rawQuery);
    const externalProduct = '(?:טלוויזיה|מקרר|מזגן|אייפון|טלפון|סמארטפון|מחשב|מחשב נייד|רכב|מכונית|ביטוח|דירה|ביטקוין|מלון|טיסה|משכנתא|אוזניות|מצלמה|מכונת כביסה|נעליים)';
    const directExternal = new RegExp(String.raw`(?:^|\s)(?:כמה עולה|מה המחיר של|מחיר של|כמה יעלה)\s+${externalProduct}(?:\s|$)`).test(clean)
        || new RegExp(String.raw`(?:^|\s)(?:איזה|איזו|איזה דגם|איזו חברה|מה כדאי לקנות|מה מומלץ לקנות)\s+${externalProduct}(?:\s|$)`).test(clean);

    // Generic price firewall: "כמה עולה?" is a valid MySong question, but
    // "כמה עולה <unrelated thing>?" must not inherit MySong pricing from context/fuzzy matching.
    const priceMatch = clean.match(/^(?:כמה עולה|מה המחיר של|מחיר של|כמה יעלה)\s+(.+)$/);
    let unrelatedPriceObject = false;
    if (priceMatch) {
        const rest = priceMatch[1].trim();
        const mysongPriceAnchors = [
            'זה', 'לי', 'השירות', 'שירות', 'אצלכם', 'לכם', 'הפצה', 'להפיץ', 'להוציא', 'שיר', 'טרק', 'טראק', 'סינגל', 'אלבום', 'דיסק', 'פרויקט', 'ep', 'איפי',
            'מייסונג', 'מדיה', 'רדיו', 'דיגיטל', 'ספוטיפיי', 'spotify', 'אפל מיוזיק', 'עמוד', 'חבילה',
            'קליפ', 'עיצוב', 'קומוניקט', 'פיצינג', 'פיצ׳ינג', 'ניטור', 'ניו מדיה', 'יחסי ציבור'
        ];
        unrelatedPriceObject = rest.length > 1 && !mysongPriceAnchors.some(anchor => rest.includes(anchor));
    }

    return directExternal || unrelatedPriceObject || hasAnyPhrase(clean, [
        'ביטוח רכב', 'ביטוח דירה', 'מזג אוויר', 'מזג האוויר', 'תחזית מזג אוויר', 'תחזית מזג האוויר',
        'מתכון לעוגה', 'מתכון לפסטה', 'מתכון לאוכל', 'איך מבשלים',
        'מי נשיא ארצות הברית', 'תוצאה של משחק כדורגל', 'תוצאות כדורגל',
        'איפה יש פיצה', 'פיצה טובה', 'מסעדה טובה', 'מלון מומלץ', 'טיסה זולה',
        'כמה משכנתא', 'ריבית משכנתא'
    ]);
};

const isExplicitNewProjectTurn = (rawQuery) => {
    const clean = normalizeBaseText(rawQuery);
    const release = detectExplicitReleaseType(rawQuery);
    if (!release) return false;
    return hasAnyPhrase(clean, [
        'יש לי אלבום', 'יש לנו אלבום', 'יש לו אלבום', 'יש לה אלבום',
        'יש לי סינגל', 'יש לנו סינגל', 'יש לו סינגל', 'יש לה סינגל',
        'יש לי ep', 'יש לנו ep', 'יש לו ep', 'יש לה ep',
        'מנהל של זמר', 'מנהלת של זמר', 'מנהל של זמרת', 'מנהלת של זמרת'
    ]);
};

const isContextDependentTurn = (rawQuery, context = {}) => {
    const clean = normalizeBaseText(rawQuery);
    const words = clean.split(/\s+/).filter(Boolean);
    const hasPrior = !!(context.currentTopic || context.lastIntentId || context.awaitingAnswer || context.memory?.releaseType || Number(context.turnCount || 0));
    if (!hasPrior || !clean || isObviousExternalDomainQuery(rawQuery) || isExplicitNewProjectTurn(rawQuery)) return false;

    if (context.awaitingAnswer && isShortStateReply(words, clean)) return true;

    const first = words[0] || '';
    const startsAsContinuation = ['ומה', 'וכמה', 'והאם', 'ואיך', 'ואם', 'וגם', 'ואז', 'ועכשיו', 'אז', 'עכשיו'].includes(first)
        || /^(?:ולסינגל|ולאלבום|ולep|ולאיפי|ולאי)$/.test(first)
        || hasAnyPhrase(clean, ['ומה לגבי', 'ומה עם', 'ולסינגל', 'ולאלבום', 'ול־ep', 'ולep']);
    if (words.length <= 9 && startsAsContinuation) return true;

    // A complete question that explicitly names its own topic is self-contained, even if it
    // happens to contain a generic phrase such as "כמה זה עולה".
    const explicitStandaloneTopic = isExplicitDigitalQuery(rawQuery)
        || !!detectExplicitReleaseType(rawQuery)
        || hasAnyPhrase(clean, ['ביט', 'רישיון', 'רשיון', 'אקו״ם', 'אקום', 'תחנה', 'תחנות', 'שדרן', 'שדרנית', 'איש מדיה', 'חשבונית', 'קבלה', 'וואטסאפ', 'טלפון']);
    if (explicitStandaloneTopic) return false;

    if (words.length <= 8 && hasAnyPhrase(clean, [
        'כמה זה עולה', 'מה חסר', 'מה חסר לי', 'מה עוד חסר', 'מה עדיין חסר',
        'מה צריך לשלוח', 'מה עוד צריך לשלוח', 'מה כלול', 'אפשר להתחיל',
        'אפשר כבר להתחיל', 'אפשר להתחיל עכשיו', 'מה עושים עכשיו', 'מה השלב הבא',
        'ואם כבר יש לי', 'כבר יש לי', 'ומה עכשיו'
    ])) return true;

    if (words.length <= 7 && hasAnyPhrase(clean, ['אותו', 'אותה', 'אותם', 'אותן', 'איתו', 'איתה', 'לגבי זה', 'במקרה הזה'])) return true;

    return false;
};
